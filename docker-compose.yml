version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    restart: always
    environment:
      POSTGRES_DB: wagering_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.0
    container_name: wagering-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering-app-1
    restart: on-failure
    environment:
      - PORT=3000
      - INSTANCE_ID=app-1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=wagering_db
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "3000:3000"
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering-app-2
    restart: on-failure
    environment:
      - PORT=3000
      - INSTANCE_ID=app-2
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=wagering_db
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  app-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering-app-3
    restart: on-failure
    environment:
      - PORT=3000
      - INSTANCE_ID=app-3
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=wagering_db
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
